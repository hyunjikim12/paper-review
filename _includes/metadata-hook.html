<!-- 홈 제목용 serif 글꼴 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&display=swap"
>

<script>
  /* 검색창 문구를 Search papers...로 바꾸고, Ctrl+K(맥은 ⌘K)로 바로 검색창에 들어가게 한다 */
  document.addEventListener('DOMContentLoaded', function () {
    const input = document.getElementById('search-input');
    if (!input) return;
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
    input.placeholder = 'Search papers...';
    const hint = document.createElement('span');
    hint.className = 'search-shortcut';
    hint.textContent = isMac ? '⌘ K' : 'Ctrl K';
    input.after(hint);
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        input.focus();
      }
    });
  });
</script>
